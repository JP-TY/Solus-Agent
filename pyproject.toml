[project]
name = "solus"
version = "0.1.0"
description = "Solus — Philippine rooftop solar concierge on Bedrock AgentCore"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "strands-agents>=1.28.0",
    "strands-agents-tools>=0.2.21",
    "bedrock-agentcore>=1.4.1",
    "bedrock-agentcore-starter-toolkit>=0.3.0",
    "playwright>=1.58.0",
    "nest-asyncio>=1.6.0",
    "boto3>=1.34.0",
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
